name: Update Presets

on:
  schedule:
    - cron: '0 0 * * 1' # Запуск каждый понедельник в 00:00 UTC
  workflow_dispatch:      # Позволяет запускать вручную из интерфейса GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Важно для коммита обратно в репозиторий

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run Scraper
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add presets.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update presets.json" && git push)
